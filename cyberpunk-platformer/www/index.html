<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON RUNNER: Blackout City</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="rotate-hint">⟳ ROTATE DEVICE TO LANDSCAPE<br>Blackout City runs sideways, runner.</div>
  <div id="root">
    <canvas id="game" width="480" height="272"></canvas>
    <canvas id="glcanvas" width="480" height="272"></canvas>

    <div id="hud">
      <div id="hud-shards">◆ <span id="shard-count">0</span>/<span id="shard-total">0</span></div>
      <div id="hud-level">SECTOR <span id="level-num">1</span></div>
      <div id="hud-lives">♥ <span id="lives-count">3</span></div>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlay-inner">
        <h1 id="overlay-title">NEON RUNNER</h1>
        <div id="overlay-text"></div>
        <button id="overlay-btn">START</button>
      </div>
    </div>

    <div id="touch-controls">
      <div id="touch-left" class="touch-btn">◀</div>
      <div id="touch-right" class="touch-btn">▶</div>
      <div id="touch-jump" class="touch-btn">⤒</div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/lighting.js"></script>
  <script src="js/shader.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/story.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
